name: APJ TR smoke test
on:
  push:
    branches:
      - apjtr-security-fixes
  workflow_dispatch:
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check app.js
          node --check test/integration.js
          node --check test/persistence.js
      - name: Check responsive layout and safe restore state
        run: |
          grep -q '@media(max-width:850px)' style.css
          grep -q '@media(max-width:520px)' style.css
          grep -q 'main{width:100%' style.css
          grep -q "\$('#restore').disabled=true" app.js

      - name: Check backup and restore safety notice
        run: |
          grep -q 'બેકઅપ JSONમાં' index.html
          grep -q 'મૂળ કન્ટેન્ટ આ JSONમાં સામેલ નથી' index.html
          grep -q 'હાલ બંધ' index.html
          grep -q "\$('#restore').disabled=true" app.js

      - name: Start app and verify core routes
        shell: bash
        run: |
          export ADMIN_PASSWORD='CI-only-password-12345'
          export DATA_DIR="$(mktemp -d)"
          export PORT=3123
          node server.js >server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3123/ >/tmp/apj-index.html; then break; fi
            sleep 1
          done
          grep -q 'APJ TR' /tmp/apj-index.html
          curl -fsS http://127.0.0.1:3123/style.css >/dev/null
          curl -fsS http://127.0.0.1:3123/app.js >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3123/api/records/students)" = "401"
          curl -fsS -c /tmp/apj-cookie -H 'Content-Type: application/json' -d '{"username":"admin","password":"CI-only-password-12345"}' http://127.0.0.1:3123/api/login | grep -q '"ok":true'
          curl -fsS -b /tmp/apj-cookie http://127.0.0.1:3123/api/records/students >/dev/null

      - name: Integration tests for records, files and sessions
        run: node test/integration.js

      - name: Persistence test across server restart
        run: node test/persistence.js
