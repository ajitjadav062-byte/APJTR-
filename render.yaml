services:
  - type: web
    name: apj-tr-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: apj-tr-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"
databases:
  - name: apj-tr-db
    databaseName: apjtr
    user: apjtr
